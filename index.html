<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Algebraic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- THE DISGUISE: Fully Functional Calculator -->
    <div id="calculator-container">
        <div class="calc-header">Algebra Engine v2.4</div>
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="btn clear" onclick="clearDisplay()">C</button>
            <button class="btn op" onclick="appendValue('^')">xʸ</button>
            <button class="btn op" onclick="appendValue('sqrt(')">√</button>
            <button class="btn op" onclick="appendValue('/')">/</button>

            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn op" onclick="appendValue('*')">*</button>

            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn op" onclick="appendValue('-')">-</button>

            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn op" onclick="appendValue('+')">+</button>

            <button class="btn zero" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
            <button class="btn equal" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- THE HIDDEN GAME LAYER (Initially Invisible) -->
    <div id="game-container" class="hidden">
        <div id="game-canvas-placeholder">
            <h1>Game Loaded Successfully</h1>
            <p>Welcome to the block world. (Integrate your 3D engine/Three.js code here)</p>
            <button onclick="lockGame()">Return to Calculator</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
