<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Matrix Math Utility</title>
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: monospace; overflow: hidden; }
        #calculator { width: 300px; margin: 80px auto; background: #2d2d2d; padding: 25px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        #screen { background: #cfd8dc; color: #1a5f1a; height: 70px; font-size: 22px; text-align: left; padding: 12px; margin-bottom: 20px; border-radius: 6px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); overflow: hidden; white-space: pre; font-weight: bold; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .btn { width: 65px; height: 55px; font-size: 20px; cursor: pointer; background: #3e3e3e; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; }
        .btn:active { background: #555555; }
        .control-btn { background: #e65100; } /* Accent color for movements */
    </style>
</head>
<body>

    <div id="calculator">
        <!-- The Screen displays math outputs OR your text world -->
        <div id="screen">0</div>
        
        <div class="row">
            <button class="btn" onclick="press('1')">1</button>
            <button class="btn" onclick="press('3')">3</button>
            <button class="btn" onclick="press('5')">5</button>
        </div>
        <div class="row">
            <button class="btn" onclick="press('7')">7</button>
            <button class="btn" onclick="press('-')">-</button>
            <button class="btn" onclick="clearScreen()">C</button>
        </div>
        <div class="row">
            <!-- Buttons serve as direction pads once unlocked -->
            <button class="btn control-btn" onclick="press('W')">W</button>
            <button class="btn control-btn" onclick="press('A')">A</button>
            <button class="btn control-btn" onclick="press('D')">D</button>
        </div>
        <div class="row">
            <button class="btn control-btn" onclick="press('S')">S</button>
            <button class="btn" style="width: 100%;" onclick="evaluateExpression()">=</button>
        </div>
    </div>

    <script>
    let expression = "";
    let gameActive = false;
    const screen = document.getElementById("screen");

    // Game Variables (Hidden completely in standard tracking variables)
    let pX = 2; // Player X position
    let pY = 1; // Player Y position
    let map = [
        ["#", "#", "#", "#", "#"],
        ["#", ".", ".", ".", "#"],
        ["#", ".", "#", ".", "#"],
        ["#", ".", ".", ".", "#"],
        ["#", "#", "#", "#", "#"]
    ];

    function press(val) {
        if (gameActive) {
            // Game logic loop handles inputs as player vectors instead of variables
            handleGameInput(val);
            return;
        }
        if (expression === "0") expression = "";
        expression += val;
        screen.innerText = expression;
    }

    function clearScreen() {
        expression = "0";
        gameActive = false;
        screen.innerText = expression;
    }

    function evaluateExpression() {
        // Trigger check
        if (expression === "1357") {
            gameActive = true;
            renderWorld();
            return;
        }
        
        // Standard calculator evaluation
        try {
            let result = eval(expression);
            expression = String(result);
            screen.innerText = expression;
        } catch (e) {
            screen.innerText = "Error";
            expression = "";
        }
    }

    function renderWorld() {
        let view = "";
        for (let y = 0; y < map.length; y++) {
            let line = "";
            for (let x = 0; x < map[y].length; x++) {
                if (x === pX && y === pY) {
                    line += "P "; // P represents the player sandbox position
                } else {
                    line += map[y][x] + " ";
                }
            }
            view += line + "\n";
        }
        screen.innerText = view;
    }

    function handleGameInput(key) {
        let nextX = pX;
        let nextY = pY;

        if (key === "W") nextY--;
        if (key === "S") nextY++;
        if (key === "A") nextX--;
        if (key === "D") nextX++;

        // Collision Check: Only move if the block isn't a solid structure wall "#"
        if (map[nextY] && map[nextY][nextX] !== "#") {
            pX = nextX;
            pY = nextY;
        }
        
        renderWorld();
    }
    </script>
</body>
</html>
